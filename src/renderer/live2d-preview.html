<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Athena Live2D Lite Preview</title>
  </head>
  <body>
    <main class="preview-shell">
      <section class="stage" aria-label="Live2D preview stage">
        <canvas id="avatar" aria-label="Athena Live2D avatar"></canvas>
      </section>
      <aside class="controls">
        <strong>Athena Live2D Lite</strong>
        <label>表情<select id="expression"></select></label>
        <label>动作<select id="motion"></select></label>
        <label>口型<input id="mouth" type="range" min="0" max="1" step="0.01" value="0" /></label>
        <output id="status">正在加载</output>
      </aside>
    </main>
    <script type="module" src="/avatar/live2d/preview.ts"></script>
  </body>
</html>
