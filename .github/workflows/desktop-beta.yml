name: Desktop 0.9 Beta

on:
  push:
    branches: [main]
    tags: ['desktop-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      signed_candidate:
        description: Require the code-signing secret and produce a distributable candidate
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  module-audit:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud/package-lock.json
      - name: Install locked Node dependencies
        run: |
          npm.cmd ci
          npm.cmd --prefix cloud ci
      - name: Verify Node and service modules
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm.cmd run typecheck
          npm.cmd run test:ci-workflows
          npm.cmd run test:model-adapters
          npm.cmd run test:skill-library
          npm.cmd run test:mcp-integrations
          npm.cmd run test:research-tools
          npm.cmd run test:agent-routing
          npm.cmd run test:creative-state
          npm.cmd run test:cloud-sync
          npm.cmd run test:account-acceptance-cleanup
          npm.cmd --prefix cloud run verify
          npm.cmd --prefix cloud run drill
      - name: Rebuild SQLite for Electron ABI
        run: npm.cmd run rebuild:sqlite:electron
      - name: Verify Electron-backed modules
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm.cmd run test:cloud-sync-boundaries
          npm.cmd run test:chat-windows
          npm.cmd run test:chat-handoff
          npm.cmd run test:memory-recall-evals
          npm.cmd run test:memory-embeddings
          npm.cmd run test:memory-retention
          npm.cmd run test:update-policy
          npm.cmd run test:desktop-reliability
          npm.cmd run test:model-providers
          npm.cmd run test:agent-foundation
          npm.cmd run test:agent-runtime
          npm.cmd run test:project-workspace
          npm.cmd run test:artifact-tools
          npm.cmd run test:image-providers
          npm.cmd run test:image-runtime
          npm.cmd run test:chat-attachments
          npm.cmd run test:chat-attachment-formats
          npm.cmd run test:chat-attachment-migration
          npm.cmd run test:chat-drop
          npm.cmd run test:project-memory
          npm.cmd run test:project-documents
          npm.cmd run test:local-ocr
          npm.cmd run test:execute:e2e
          npm.cmd run test:diagnostics
          npm.cmd run test:initiative
          npm.cmd run test:voice-service
          npm.cmd run test:voice-activity
          npm.cmd run test:live2d:runtime
          npm.cmd run test:live2d:desktop-pet
          node scripts/verify-live2d-release-package.js --source-only
      - name: Prove audit checkout remained clean
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git diff --exit-code
          if (git status --porcelain --untracked-files=all) { throw 'Module audit created an unignored source-tree file.' }

  clean-checkout:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CI: 'true'
      ATHENA_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-voice.lock.txt
      - name: Record deterministic source time
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('SOURCE_DATE_EPOCH=' + (git show -s --format=%ct HEAD))
      - name: Install locked dependencies
        run: npm.cmd ci
      - name: Restore managed voice runtime
        uses: actions/cache@v4
        with:
          path: |
            .build/voice-cache
            resources/voice-runtime
          key: voice-runtime-${{ runner.os }}-x64-py311-${{ hashFiles('scripts/prepare-voice-runtime.js', 'requirements-voice.lock.txt', 'stt_whisper.py', 'tts_piper.py', 'tts-local.ps1', 'tts-capabilities.ps1', 'play_audio_local.ps1') }}
      - name: Prepare managed voice runtime
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath resources\voice-runtime\voice-runtime-manifest.json) {
            npm.cmd run test:voice-runtime
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Warning 'Cached voice runtime failed verification; rebuilding it from pinned sources.'
          }
          npm.cmd run prepare:voice-runtime
          npm.cmd run test:voice-runtime
      - name: Verify release tag identity
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "desktop-v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match package version $version."
          }
      - name: Rebuild SQLite for Electron ABI
        run: npm.cmd run rebuild:sqlite:electron
      - name: Verify release engineering
        run: npm.cmd run test:release
      - name: Verify product regression suite
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm.cmd run typecheck
          npm.cmd run test:persona
          npm.cmd run test:modes
          npm.cmd run test:theme
          npm.cmd run test:interface-presets
          npm.cmd run test:logger
          npm.cmd run test:security
          npm.cmd run test:privacy
          npm.cmd run test:desktop-faults
          npm.cmd run test:commercial
          npm.cmd run test:supply-chain
          npm.cmd run test:web-search
          npm.cmd run test:tools
          npm.cmd run audit:security
      - name: Development smoke
        run: npm.cmd run smoke:electron
      - name: Build unsigned CI evidence
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.signed_candidate != true }}
        run: npm.cmd run build -- --require-clean
      - name: Build signed candidate
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.signed_candidate == true }}
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          ATHENA_SIGNING_PUBLISHER: ${{ secrets.WINDOWS_SIGNING_PUBLISHER }}
          ATHENA_UPDATE_BASE_URL: ${{ secrets.ATHENA_UPDATE_BASE_URL }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm.cmd run release:preflight
          npm.cmd run build:release -- --require-clean
      - name: Packaged smoke
        run: npm.cmd run test:packaged-smoke
      - name: Verify packaged desktop contents
        run: npm.cmd run test:desktop-package
      - name: Generate exact candidate manifest
        run: npm.cmd run release:manifest
      - name: Verify signed Private Beta candidate
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.signed_candidate == true }}
        shell: pwsh
        run: |
          $manifest = Get-ChildItem -LiteralPath release\candidates -Filter candidate-manifest.json -Recurse | Select-Object -First 1
          if (-not $manifest) { throw 'Candidate manifest was not generated.' }
          npm.cmd run release:verify-candidate -- --manifest $manifest.FullName
      - name: Prove checkout remained clean
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git diff --exit-code
          if (git status --porcelain --untracked-files=all) { throw 'Build created an unignored source-tree file.' }
      - uses: actions/upload-artifact@v4
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        with:
          name: athena-desktop-${{ github.sha }}
          path: release/candidates/**
          if-no-files-found: error
          retention-days: 7
