appId: com.athena.desktop
productName: Athena
directories:
  output: release
asar: true
artifactName: "${productName} Setup ${version}.${ext}"
files:
  - dist/**/*
  - resources/**/*
  - "!resources/OllamaSetup.exe"
  - config/**/*
  - skills/**/*
  - assets/**/*
  - "!**/*.map"
  - "!**/*.d.ts"
extraResources:
  - from: .build/build-info.json
    to: build-info.json
  - from: .build/update-config.json
    to: update-config.json
  - from: .build/app-update.yml
    to: app-update.yml
  - from: .build/database
    to: database
    filter:
      - "athena.db"
      - "!**/*-wal"
      - "!**/*-shm"
      - "!backups/**"
      - "!migrations/**"
      - "!seeds/**"
  - from: stt_whisper.py
    to: voice/stt_whisper.py
  - from: tts-local.ps1
    to: voice/tts-local.ps1
  - from: play_audio_local.ps1
    to: voice/play_audio_local.ps1
  - from: requirements-voice.txt
    to: voice/requirements-voice.txt
win:
  target: nsis
  icon: resources/su-shixia.ico
  signAndEditExecutable: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  differentialPackage: true
  deleteAppDataOnUninstall: false
