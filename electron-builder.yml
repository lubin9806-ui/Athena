appId: com.athena.desktop
productName: Athena
directories:
  output: release
asar: true
artifactName: "${productName} Setup ${version}.${ext}"
files:
  - dist/**/*
  - "!dist/renderer/steam/**/*"
  - "!dist/renderer/vendor/live2d/**/*"
  - resources/**/*
  - "!resources/OllamaSetup.exe"
  - "!resources/voice-runtime/**/*"
  - "!resources/image-runtime/**/*"
  # Package only immutable Direct-desktop defaults. A wildcard here previously
  # leaked local Skill invocation state and unrelated Store/Steam/ops configs.
  - config/app.json
  - config/commercial.json
  - config/memory.json
  - config/theme.json
  - "!config/settings.json"
  - "!config/settings.local.json"
  - "!config/model.json"
  - "!config/model.local.json"
  - "!config/personas/**/*"
  - "!config/private/**/*"
  - skills/**/*
  # Renderer assets are already emitted under dist/renderer by Vite. Shipping
  # the source asset tree as well duplicated UI/Steam artwork in app.asar.
  - "!assets/**/*"
  - "!dist/app/avatar/**/*"
  - "!dist/app/live2d-preload.js"
  - "!dist/core/avatar/**/*"
  - "!dist/renderer/avatar/**/*"
  - "!dist/renderer/live2d-*.html"
  - "!dist/renderer/live2d-*.js"
  - "!dist/renderer/live2d-*.css"
  - "!node_modules/untitled-pixi-live2d-engine/**/*"
  - "!node_modules/three/**/*"
  - "!node_modules/@pixiv/**/*"
  - "!node_modules/steamworks.js/**/*"
  - "!node_modules/better-sqlite3/src/**/*"
  - "!node_modules/better-sqlite3/deps/**/*"
  - "!**/*.map"
  - "!**/*.d.ts"
extraResources:
  - from: .build/build-info.json
    to: build-info.json
  - from: .build/update-config.json
    to: update-config.json
  - from: .build/app-update.yml
    to: app-update.yml
  - from: .build/database
    to: database
    filter:
      - "athena.db"
      - "!**/*-wal"
      - "!**/*-shm"
      - "!backups/**"
      - "!migrations/**"
      - "!seeds/**"
  - from: resources/voice-runtime
    to: voice
  - from: resources/image-runtime
    to: image-runtime
win:
  target: nsis
  icon: resources/athena-brand.ico
  signAndEditExecutable: true
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  differentialPackage: true
  deleteAppDataOnUninstall: false
